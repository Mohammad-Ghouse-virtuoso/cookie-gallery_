name: CI

on:
  push:
    branches: [ main, cookie_gallery_stripe ]
  pull_request:
    branches: [ main, cookie_gallery_stripe ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install frontend dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint || echo "⚠️ Linter warnings found (non-blocking)"
      continue-on-error: true
    
    - name: Run frontend tests
      run: npm run test -- --run
      env:
        CI: true
    
    - name: Build project
      run: npm run build
      env:
        CI: true
    
    - name: Install backend dependencies
      run: |
        cd src/backend
        npm ci
    
    - name: Run backend tests
      run: npm run test:backend
      env:
        CI: true
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    
    - name: Run E2E tests
      run: npm run test:e2e || echo "⚠️ E2E tests had issues (non-blocking)"
      continue-on-error: true
      env:
        CI: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/
        if-no-files-found: ignore
    
    - name: Check for security vulnerabilities
      run: npm audit --audit-level=high || echo "⚠️ Security audit found issues (non-blocking)"
      continue-on-error: true

  performance:
    name: Performance Tests (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false  # Disabled for now - enable when ready with proper credentials
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Performance tests
      run: echo "⚠️ Performance tests disabled - enable in workflow when ready"

  security:
    name: Security Scan (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check for secrets in code
      run: |
        echo "🔍 Scanning for exposed secrets..."
        if grep -r "sk_live_" . --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
          echo "⚠️ Warning: Found potential live Stripe keys"
        else
          echo "✅ No live Stripe keys found"
        fi
        
        if grep -r "firebase.*private.*key" . --exclude-dir=node_modules --exclude-dir=.git --exclude=".env.example" 2>/dev/null; then
          echo "⚠️ Warning: Found potential Firebase credentials"
        else
          echo "✅ No exposed Firebase credentials found"
        fi
        
        echo "✅ Security scan completed"
