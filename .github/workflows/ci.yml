name: CI

on:
  push:
    branches: [ main, cookie_gallery_stripe ]
  pull_request:
    branches: [ main, cookie_gallery_stripe ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
      continue-on-error: true
    
    - name: Run tests
      run: npm run test -- --run
    
    - name: Build project
      run: npm run build
    
    - name: Install backend dependencies
      run: |
        cd src/backend
        npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    
    - name: Run backend tests (including contract tests)
      run: npm run test:backend
    
    - name: Run E2E tests
      run: npm run test:e2e
      continue-on-error: true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/
    
    - name: Check for security vulnerabilities
      run: npm audit --audit-level=high
      continue-on-error: true

  performance:
    runs-on: ubuntu-latest
    # Only run performance tests when secrets are available (e.g., not on forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true  # Don't fail the workflow if performance tests fail
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6 -y
    
    - name: Install backend dependencies
      run: |
        cd src/backend
        npm ci
    
    - name: Create mock environment
      run: |
        cd src/backend
        cat > .env << EOF
        # Mock environment for performance testing
        STRIPE_SECRET_KEY=sk_test_mock_key_for_ci
        FIREBASE_PROJECT_ID=mock-project
        FIREBASE_CLIENT_EMAIL=mock@mock.iam.gserviceaccount.com
        FIREBASE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\nMOCK_KEY\n-----END PRIVATE KEY-----"
        CORS_ORIGIN=http://localhost:5173
        PORT=5000
        NODE_ENV=test
        EOF
    
    - name: Start backend server
      run: |
        cd src/backend
        # Start server in background, redirect output to log file
        node server.js > /tmp/backend.log 2>&1 &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID"
        
        # Wait for server to be ready (max 30 seconds)
        for i in {1..30}; do
          if curl -s http://localhost:5000/health > /dev/null 2>&1; then
            echo "✅ Backend server is ready!"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 1
        done
        
        # Check if server is actually running (don't fail, just log)
        if ! curl -s http://localhost:5000/health > /dev/null 2>&1; then
          echo "⚠️ Backend server not responding"
          echo "=== Backend logs ==="
          cat /tmp/backend.log || echo "No logs available"
          echo "Performance tests will be skipped"
        fi
      continue-on-error: true
      env:
        NODE_ENV: test
    
    - name: Run performance tests
      run: |
        echo "🚀 Running performance baseline tests..."
        # Only run if backend is up
        if curl -s http://localhost:5000/health > /dev/null 2>&1; then
          npm run perf:health || echo "⚠️ Health check performance needs optimization"
        else
          echo "⚠️ Skipping performance tests - backend not available"
          echo "This is expected in CI without proper credentials"
        fi
      continue-on-error: true
    
    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance/results/
        if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail workflow on security warnings
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for secrets in code
      run: |
        if grep -r "sk_live_" . --exclude-dir=node_modules --exclude-dir=.git; then
          echo "❌ Found live Stripe keys in code!"
          exit 1
        fi
        if grep -r "firebase.*private.*key" . --exclude-dir=node_modules --exclude-dir=.git --exclude=".env.example"; then
          echo "⚠️ Warning: Possible Firebase credentials in code"
        fi
        echo "✅ No obvious secrets found"
