<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Performance: Preconnect & Preload Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    </noscript>

    <!-- Optional: Preload critical hero image (best-effort) -->
    <link rel="preload" as="image" href="/src/assets/Cookie-Hero%20Card.png" imagesrcset="/src/assets/Cookie-Hero%20Card.png 1x" fetchpriority="high" />

    <title>Cookie Gallery – Fresh, Handcrafted Cookies</title>
    <meta name="description" content="Handcrafted cookies baked with love. Order your favorites and enjoy fresh goodness delivered." />
    <meta name="theme-color" content="#2563eb" />

    <!-- Canonical -->
    <link rel="canonical" href="https://cookie-gallery.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Cookie Gallery – Fresh, Handcrafted Cookies" />
    <meta property="og:description" content="Handcrafted cookies baked with love. Order your favorites and enjoy fresh goodness delivered." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cookie-gallery.vercel.app/" />
    <meta property="og:image" content="https://cookie-gallery.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cookie Gallery – Fresh, Handcrafted Cookies" />
    <meta name="twitter:description" content="Handcrafted cookies baked with love. Order your favorites and enjoy fresh goodness delivered." />
    <meta name="twitter:image" content="https://cookie-gallery.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
